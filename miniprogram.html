<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>膝关节康复波形分类</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf9 100%);
            color: #333;
            line-height: 1.6;
            padding: 15px;
            max-width: 100%;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            background: linear-gradient(90deg, #3498db, #2c3e50);
            color: white;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-title i {
            color: #3498db;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #3498db, #2980b9);
            color: white;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            color: white;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(90deg, #95a5a6, #7f8c8d);
            color: white;
            box-shadow: 0 4px 10px rgba(149, 165, 166, 0.3);
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(149, 165, 166, 0.4);
        }
        
        .result-card {
            text-align: center;
            padding: 25px;
        }
        
        .result-value {
            font-size: 28px;
            font-weight: 700;
            margin: 15px 0;
        }
        
        .prediction-result {
            color: #3498db;
        }
        
        .confidence-result {
            color: #2ecc71;
        }
        
        .progress-container {
            margin: 20px 0;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .progress-bar {
            height: 12px;
            background: #ecf0f1;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }
        
        .progress-fill.primary {
            background: linear-gradient(90deg, #3498db, #2980b9);
        }
        
        .progress-fill.success {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
        }
        
        .progress-fill.warning {
            background: linear-gradient(90deg, #f39c12, #d35400);
        }
        
        .progress-fill.danger {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
        }
        
        .probability-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        
        .probability-item:last-child {
            border-bottom: none;
        }
        
        .probability-label {
            font-weight: 500;
        }
        
        .probability-value {
            font-weight: 600;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            padding: 10px;
            border-radius: 10px;
            background: #e8f4fc;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3498db;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .tabs {
            display: flex;
            background: white;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: #3498db;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .file-info {
            background: #e8f4fc;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .ai-tip {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 0 10px 10px 0;
            margin: 15px 0;
        }
        
        .ai-tip h4 {
            margin-bottom: 8px;
            color: #2c3e50;
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 20px;
            }
            
            .card {
                padding: 15px;
            }
            
            .btn {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 膝关节康复波形分类</h1>
            <p>基于AI的膝关节角度识别系统</p>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('train')">🧠 模型训练</div>
            <div class="tab" onclick="switchTab('predict')">🔍 波形预测</div>
        </div>
        
        <!-- 训练模块 -->
        <div id="train-tab" class="tab-content active">
            <div class="card">
                <h3 class="card-title">⚙️ 训练配置</h3>
                
                <div class="form-group">
                    <label for="dataDir">数据目录</label>
                    <input type="text" id="dataDir" class="form-control" placeholder="请输入数据目录路径">
                    <button class="btn btn-secondary" style="margin-top: 10px;" onclick="browseFolder('dataDir')">📁 选择目录</button>
                </div>
                
                <div class="form-group">
                    <label for="modelPath">模型保存路径</label>
                    <input type="text" id="modelPath" class="form-control" value="waveform_model.pth" placeholder="请输入模型保存路径">
                </div>
                
                <div class="form-group">
                    <label for="epochs">训练轮数</label>
                    <input type="number" id="epochs" class="form-control" value="50" min="1" max="1000">
                </div>
                
                <button class="btn btn-primary" onclick="startTraining()">
                    🚀 开始训练
                </button>
            </div>
            
            <div class="card">
                <h3 class="card-title">📊 训练状态</h3>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span id="trainingStatus">等待开始训练</span>
                </div>
                
                <div class="progress-container">
                    <div class="progress-label">
                        <span>训练进度</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill primary" id="trainingProgress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="ai-tip">
                    <h4>🤖 AI提示</h4>
                    <p>建议训练轮数设置为50-100轮，可以获得较好的分类效果。训练过程中请保持网络畅通。</p>
                </div>
            </div>
        </div>
        
        <!-- 预测模块 -->
        <div id="predict-tab" class="tab-content">
            <div class="card">
                <h3 class="card-title">🔮 预测配置</h3>
                
                <div class="form-group">
                    <label for="predictModelPath">模型文件</label>
                    <input type="text" id="predictModelPath" class="form-control" value="waveform_model.pth" placeholder="请输入模型文件路径">
                    <button class="btn btn-secondary" style="margin-top: 10px;" onclick="browseFile('predictModelPath')">📁 选择模型</button>
                </div>
                
                <div class="form-group">
                    <label for="dataFile">数据文件</label>
                    <input type="text" id="dataFile" class="form-control" placeholder="请输入待预测数据文件路径">
                    <button class="btn btn-secondary" style="margin-top: 10px;" onclick="browseFile('dataFile')">📁 选择文件</button>
                </div>
                
                <div id="fileInfo" class="file-info" style="display: none;">
                    已选择文件: <span id="fileName"></span>
                </div>
                
                <button class="btn btn-success" onclick="startPrediction()">
                    🔍 开始预测
                </button>
            </div>
            
            <div class="card">
                <h3 class="card-title">🎯 预测结果</h3>
                <div class="result-card">
                    <div>预测类别</div>
                    <div class="result-value prediction-result" id="predictionResult">--</div>
                    <div>置信度</div>
                    <div class="result-value confidence-result" id="confidenceResult">--</div>
                </div>
            </div>
            
            <div class="card">
                <h3 class="card-title">📈 概率分布</h3>
                <div id="probabilityList">
                    <div class="probability-item">
                        <span class="probability-label">暂无数据</span>
                        <span class="probability-value">--</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 切换标签页
        function switchTab(tabName) {
            // 更新标签页按钮状态
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 显示对应的标签页内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName + '-tab').classList.add('active');
        }
        
        // 模拟浏览文件夹
        function browseFolder(fieldId) {
            alert("在实际应用中，这里会打开文件夹选择对话框");
            document.getElementById(fieldId).value = "/示例/数据/目录/";
        }
        
        // 模拟浏览文件
        function browseFile(fieldId) {
            alert("在实际应用中，这里会打开文件选择对话框");
            if (fieldId === 'predictModelPath') {
                document.getElementById(fieldId).value = "waveform_model.pth";
            } else {
                document.getElementById(fieldId).value = "sample_data.csv";
                document.getElementById('fileName').textContent = "sample_data.csv";
                document.getElementById('fileInfo').style.display = 'block';
            }
        }
        
        // 开始训练
        function startTraining() {
            const statusEl = document.getElementById('trainingStatus');
            const progressEl = document.getElementById('trainingProgress');
            const percentEl = document.getElementById('progressPercent');
            
            statusEl.textContent = '训练进行中...';
            
            // 模拟训练过程
            let progress = 0;
            const interval = setInterval(() => {
                progress += 2;
                progressEl.style.width = progress + '%';
                percentEl.textContent = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(interval);
                    statusEl.textContent = '训练完成';
                    alert('模型训练完成！');
                }
            }, 100);
        }
        
        // 开始预测
        function startPrediction() {
            // 模拟预测结果
            const predictions = {
                "内翻30°": 0.85,
                "内翻60°": 0.12,
                "内翻90°": 0.02,
                "外翻30°": 0.01
            };
            
            // 找到最高概率的类别
            let maxClass = "";
            let maxProb = 0;
            for (const [cls, prob] of Object.entries(predictions)) {
                if (prob > maxProb) {
                    maxProb = prob;
                    maxClass = cls;
                }
            }
            
            // 更新UI
            document.getElementById('predictionResult').textContent = maxClass;
            document.getElementById('confidenceResult').textContent = maxProb.toFixed(4);
            
            // 更新概率列表
            const probList = document.getElementById('probabilityList');
            probList.innerHTML = '';
            
            // 按概率排序
            const sortedPredictions = Object.entries(predictions).sort((a, b) => b[1] - a[1]);
            
            sortedPredictions.forEach(([cls, prob]) => {
                const item = document.createElement('div');
                item.className = 'probability-item';
                item.innerHTML = `
                    <span class="probability-label">${cls}</span>
                    <span class="probability-value">${prob.toFixed(4)}</span>
                `;
                probList.appendChild(item);
            });
            
            alert('预测完成！');
        }
    </script>
</body>
</html>
